<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<!-- Written into the shell (not added by the app) so link previews, which don't run JavaScript, see them. -->
		<title>Famous Desks · The Jobs Room</title>
		<meta name="description" content="Step inside Steve Jobs' home office, recreated from photographs: look around the room, browse the books on his shelf and play the music on his desk." />
		<meta name="theme-color" content="#0e0e0d" />
		<link rel="canonical" href="https://famousdesks.com/" />
		<link rel="icon" href="/favicon.svg" type="image/svg+xml" />
		<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Famous Desks" />
		<meta property="og:title" content="Famous Desks · The Jobs Room" />
		<meta property="og:description" content="Step inside Steve Jobs' home office, recreated from photographs: look around the room, browse the books on his shelf and play the music on his desk." />
		<meta property="og:url" content="https://famousdesks.com/" />
		<meta property="og:image" content="https://famousdesks.com/og-image.jpg" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta property="og:image:alt" content="Steve Jobs' home office: a desk under a framed print between two steel windows, bookshelves and a floor lamp." />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Famous Desks · The Jobs Room" />
		<meta name="twitter:description" content="Step inside Steve Jobs' home office, recreated from photographs." />
		<meta name="twitter:image" content="https://famousdesks.com/og-image.jpg" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
